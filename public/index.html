<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Runevale Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b2a;color:#f4e9ce;font-family:system-ui,-apple-system,sans-serif}header{padding:12px 16px;background:#282f45;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:20px;margin:0;color:#f4cc78}.wrap{max-width:900px;margin:auto;padding:12px}.panel{background:#252c40;border:1px solid #48516a;border-radius:12px;padding:12px;margin-bottom:12px}button,input{font:inherit;border-radius:8px;border:1px solid #65708b;padding:9px;background:#343e58;color:white}button{background:#795b32;border-color:#c49a55;cursor:pointer}button:active{transform:scale(.98)}#login{display:flex;gap:8px;flex-wrap:wrap}#name{flex:1;min-width:130px}#world{display:block;width:100%;height:auto;aspect-ratio:800/500;background:#344c42;border:2px solid #b18b4c;border-radius:10px;touch-action:manipulation}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#b9c2d5;font-size:13px}#messages{height:130px;overflow:auto;background:#151b29;padding:8px;border-radius:8px;font-size:14px}#chatForm{display:flex;gap:8px;margin-top:8px}#chatInput{min-width:0;flex:1}.zone{background:#3a4662}#status{font-size:14px}
</style>
</head>
<body>
<header><h1>⚔ Runevale Online</h1><span class="muted">Multiplayer browser prototype</span></header>
<main class="wrap">
<section class="panel" id="login"><input id="name" maxlength="16" placeholder="ชื่อตัวละคร" value="Novice"><button id="enter">เข้าโลก</button><span class="muted" id="connect">กำลังเชื่อมต่อ...</span></section>
<section class="panel" id="game" hidden>
<div class="row" style="justify-content:space-between"><strong id="status">Prontera</strong><span class="muted" id="stats"></span></div>
<div class="row" id="zones" style="margin:10px 0"></div>
<canvas id="world" width="800" height="500" aria-label="แผนที่เกม แตะตำแหน่งเพื่อเดิน"></canvas>
<p class="muted">แตะพื้นแผนที่เพื่อเดิน • แตะมอนสเตอร์เพื่อโจมตี • ผู้เล่นในแผนที่เดียวกันจะมองเห็นกัน</p>
</section>
<section class="panel"><strong>แชทโลก / แผนที่</strong><div id="messages"></div><form id="chatForm"><input id="chatInput" placeholder="พิมพ์ข้อความ..." maxlength="180"><button>ส่ง</button></form></section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let me=null,world={players:[],monsters:[]},zone="Prontera";
const $=id=>document.getElementById(id),canvas=$("world"),ctx=canvas.getContext("2d");
socket.on("connect",()=>$("connect").textContent="เชื่อมต่อเซิร์ฟเวอร์แล้ว");
socket.on("connect_error",()=>$("connect").textContent="เชื่อมต่อไม่สำเร็จ กำลังลองใหม่...");
$("enter").onclick=()=>socket.emit("join",$("name").value);
socket.on("joined",data=>{me=data.player;zone=me.zone;$("game").hidden=false;$("login").hidden=true;$("zones").innerHTML="";data.zones.forEach(z=>{const b=document.createElement("button");b.textContent=z;b.className="zone";b.onclick=()=>socket.emit("travel",z);$("zones").appendChild(b)});draw()});
socket.on("travelled",d=>{zone=d.zone;$("status").textContent=zone});
socket.on("world",d=>{world=d;draw()});
socket.on("chat",m=>{const line=document.createElement("div");line.textContent=m.system?"✦ "+m.text:(m.name+": "+m.text);$("messages").appendChild(line);$("messages").scrollTop=$("messages").scrollHeight});
function draw(){if(!me)return;ctx.clearRect(0,0,800,500);ctx.fillStyle=zone==="Prontera"?"#627c67":zone==="Morroc Desert"?"#ad8954":zone==="Payon Forest"?"#3d6651":"#4d745e";ctx.fillRect(0,0,800,500);ctx.strokeStyle="rgba(240,220,170,.14)";for(let x=0;x<800;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}
ctx.fillStyle="#d9c18a";ctx.font="bold 20px system-ui";ctx.fillText(zone,18,30);
(world.monsters||[]).forEach(m=>{ctx.fillStyle=m.hp>0?"#e58bb0":"#555";ctx.beginPath();ctx.arc(m.x,m.y,19,0,Math.PI*2);ctx.fill();ctx.fillStyle="#201b27";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(m.name,m.x,m.y-27);ctx.fillText(m.hp>0?m.hp+" HP":"กำลังเกิดใหม่",m.x,m.y+34)});
(world.players||[]).forEach(p=>{ctx.fillStyle=p.id===me.id?"#f5d36c":"#8fc9f2";ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="white";ctx.font="13px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.x,p.y-20)});
$("stats").textContent="Lv. "+me.level+" • "+me.job+" • HP "+me.hp}
canvas.addEventListener("click",e=>{if(!me)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*500/r.height;const m=(world.monsters||[]).find(v=>Math.hypot(v.x-x,v.y-y)<30&&v.hp>0);if(m)socket.emit("attack",m.id);else socket.emit("move",{x,y});me.x=x;me.y=y;draw()});
$("chatForm").onsubmit=e=>{e.preventDefault();const v=$("chatInput").value.trim();if(v)socket.emit("chat",v);$("chatInput").value=""};
</script>
</body></html>
