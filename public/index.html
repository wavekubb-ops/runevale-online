<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Runevale Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171b2a;color:#f4e9ce;font-family:system-ui,-apple-system,sans-serif}header{padding:12px 16px;background:#282f45;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:20px;margin:0;color:#f4cc78}.wrap{max-width:900px;margin:auto;padding:12px}.panel{background:#252c40;border:1px solid #48516a;border-radius:12px;padding:12px;margin-bottom:12px}button,input{font:inherit;border-radius:8px;border:1px solid #65708b;padding:9px;background:#343e58;color:white}button{background:#795b32;border-color:#c49a55;cursor:pointer}button:active{transform:scale(.98)}#login{display:flex;gap:8px;flex-wrap:wrap}#name{flex:1;min-width:130px}#world{display:block;width:100%;height:auto;aspect-ratio:800/500;background:#344c42;border:2px solid #b18b4c;border-radius:10px;touch-action:manipulation}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#b9c2d5;font-size:13px}#messages{height:130px;overflow:auto;background:#151b29;padding:8px;border-radius:8px;font-size:14px}#chatForm{display:flex;gap:8px;margin-top:8px}#chatInput{min-width:0;flex:1}.zone{background:#3a4662}#status{font-size:14px}#mobileControls{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0 6px;flex-wrap:wrap}#mobileControls button{min-width:76px;min-height:62px;font-size:24px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}#mobileControls #attackBtn{min-width:118px;background:#9b452f;border-color:#f0a16b;font-size:19px}#mobileControls button:active{filter:brightness(1.25);transform:scale(.96)}
</style>
</head>
<body>
<header><h1>⚔ Runevale Online</h1><span class="muted">Multiplayer browser prototype</span></header>
<main class="wrap">
<section class="panel" id="login"><input id="name" maxlength="16" placeholder="ชื่อตัวละคร" value="Novice"><button id="enter">เข้าโลก</button><span class="muted" id="connect">กำลังเชื่อมต่อ...</span></section>
<section class="panel" id="game" hidden>
<div class="row" style="justify-content:space-between"><strong id="status">Prontera</strong><span class="muted" id="stats"></span></div>
<div class="row" id="zones" style="margin:10px 0"></div>
<canvas id="world" width="800" height="500" aria-label="แผนที่เกม แตะตำแหน่งเพื่อเดิน"></canvas>
<div id="mobileControls" aria-label="ปุ่มควบคุมตัวละคร"><button id="leftBtn" type="button" aria-label="เดินซ้าย">◀</button><button id="attackBtn" type="button">⚔ ตีมอน</button><button id="rightBtn" type="button" aria-label="เดินขวา">▶</button></div>
<p class="muted">แตะพื้นแผนที่เพื่อเดิน • แตะมอนสเตอร์เพื่อโจมตี • ผู้เล่นในแผนที่เดียวกันจะมองเห็นกัน</p>
</section>
<section class="panel"><strong>แชทโลก / แผนที่</strong><div id="messages"></div><form id="chatForm"><input id="chatInput" placeholder="พิมพ์ข้อความ..." maxlength="180"><button>ส่ง</button></form></section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let me=null,world={players:[],monsters:[]},zone="Prontera",walkTimer=null,walkUntil=0,attackUntil=0,attackTarget=null,facing=0;\nconst heroSprite=new Image();heroSprite.src="/sprites/novice.svg";
const $=id=>document.getElementById(id),canvas=$("world"),ctx=canvas.getContext("2d");
socket.on("connect",()=>$("connect").textContent="เชื่อมต่อเซิร์ฟเวอร์แล้ว");
socket.on("connect_error",()=>$("connect").textContent="เชื่อมต่อไม่สำเร็จ กำลังลองใหม่...");
$("enter").onclick=()=>socket.emit("join",$("name").value);
socket.on("joined",data=>{me=data.player;zone=me.zone;$("game").hidden=false;$("login").hidden=true;$("zones").innerHTML="";data.zones.forEach(z=>{const b=document.createElement("button");b.textContent=z;b.className="zone";b.onclick=()=>socket.emit("travel",z);$("zones").appendChild(b)});draw()});
socket.on("travelled",d=>{zone=d.zone;walkUntil=0;attackUntil=0;$("status").textContent=zone});
socket.on("world",d=>{world=d;if(me){const self=(d.players||[]).find(p=>p.id===me.id);if(self){me.x=self.x;me.y=self.y;me.hp=self.hp;me.level=self.level}}draw()});
socket.on("chat",m=>{const line=document.createElement("div");line.textContent=m.system?"✦ "+m.text:(m.name+": "+m.text);$("messages").appendChild(line);$("messages").scrollTop=$("messages").scrollHeight});
function hash(n){const v=Math.sin(n*127.1+zone.length*311.7)*43758.5453;return v-Math.floor(v)}
function drawTree(x,y){ctx.fillStyle="rgba(0,0,0,.22)";ctx.fillRect(x-13,y+14,30,7);ctx.fillStyle="#68452f";ctx.fillRect(x-4,y-1,9,25);ctx.fillStyle="#24533d";ctx.fillRect(x-18,y-22,38,27);ctx.fillStyle="#36734b";ctx.fillRect(x-13,y-28,28,20);ctx.fillStyle="#57915a";ctx.fillRect(x-7,y-25,10,8)}
function drawHouse(x,y){ctx.fillStyle="rgba(0,0,0,.2)";ctx.fillRect(x-2,y+31,86,8);ctx.fillStyle="#d4b77b";ctx.fillRect(x,y,82,34);ctx.fillStyle="#874b37";ctx.fillRect(x-7,y-13,96,22);ctx.fillStyle="#b86b48";ctx.fillRect(x+5,y-9,72,13);ctx.fillStyle="#553b32";ctx.fillRect(x+34,y+13,15,21);ctx.fillStyle="#8bc3ce";ctx.fillRect(x+9,y+10,13,10);ctx.fillRect(x+60,y+10,13,10)}
function drawPoring(m){const x=Math.round(m.x),y=Math.round(m.y);ctx.fillStyle="rgba(20,20,20,.25)";ctx.fillRect(x-18,y+13,36,7);ctx.fillStyle="#c85f91";ctx.fillRect(x-17,y-8,34,23);ctx.fillStyle="#e88ab5";ctx.fillRect(x-13,y-14,26,24);ctx.fillStyle="#f5b4d0";ctx.fillRect(x-7,y-12,9,6);ctx.fillStyle="#4b2940";ctx.fillRect(x-7,y-2,3,4);ctx.fillRect(x+5,y-2,3,4);ctx.fillStyle="#fff";ctx.fillRect(x-7,y-3,2,2);ctx.fillRect(x+5,y-3,2,2)}
function drawLunatic(m){const x=Math.round(m.x),y=Math.round(m.y);ctx.fillStyle="rgba(20,20,20,.25)";ctx.fillRect(x-17,y+13,34,7);ctx.fillStyle="#b9a0d8";ctx.fillRect(x-13,y-8,26,22);ctx.fillRect(x-17,y-22,9,20);ctx.fillRect(x+8,y-22,9,20);ctx.fillStyle="#e7d8f4";ctx.fillRect(x-10,y-5,20,15);ctx.fillStyle="#42344f";ctx.fillRect(x-6,y-1,3,4);ctx.fillRect(x+4,y-1,3,4);ctx.fillStyle="#e58a9a";ctx.fillRect(x-1,y+4,3,3)}
function drawHero(p){const x=Math.round(p.x),y=Math.round(p.y),mine=p.id===me.id,now=Date.now(),moving=mine?now<walkUntil:!!p.moving,attacking=mine&&now<attackUntil;let row=mine?facing:0,frame=0;if(attacking){const progress=1-(attackUntil-now)/360;frame=4+Math.min(3,Math.floor(progress*4))}else if(moving){frame=Math.floor(now/125)%4}else frame=0;
ctx.fillStyle="rgba(0,0,0,.28)";ctx.fillRect(x-14,y+14,28,6);
if(heroSprite.complete&&heroSprite.naturalWidth){ctx.drawImage(heroSprite,frame*64,row*64,64,64,x-32,y-48,64,64)}else{ctx.fillStyle=mine?"#e5c36d":"#83bce4";ctx.fillRect(x-13,y-7,26,17);ctx.fillStyle="#f0c6a0";ctx.fillRect(x-8,y-25,16,13)}
ctx.fillStyle="#e8d6b1";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,x,y-39)}function animateAttack(target){attackUntil=Date.now()+360;attackTarget=target;draw()}
function draw(){if(!me)return;ctx.clearRect(0,0,800,500);const desert=zone==="Morroc Desert",forest=zone==="Payon Forest"||zone==="Prontera Field";const base=desert?"#b9935c":forest?"#4d7955":"#66896b";ctx.fillStyle=base;ctx.fillRect(0,0,800,500);
for(let y=0;y<500;y+=40)for(let x=0;x<800;x+=40){const n=hash(x*17+y*31);ctx.fillStyle=desert?(n>.7?"#c6a36c":n>.35?"#b9935c":"#aa8755"):(n>.72?"#71966d":n>.4?base:forest?"#47704e":"#5d805f");ctx.fillRect(x,y,40,40);ctx.fillStyle="rgba(255,255,255,.045)";ctx.fillRect(x+3,y+3,30,2);if(desert&&n>.88){ctx.fillStyle="#d7b879";ctx.fillRect(x+10,y+23,9,3)}else if(!desert&&n>.91){ctx.fillStyle="#9fb879";ctx.fillRect(x+9,y+26,4,4)}}
if(zone==="Prontera"){ctx.fillStyle="#b6a17c";ctx.fillRect(0,205,800,90);ctx.fillStyle="#d2bd93";ctx.fillRect(0,214,800,72);drawHouse(72,55);drawHouse(625,75);drawHouse(340,360);for(const [x,y] of [[40,370],[730,355],[180,70],[560,390]])drawTree(x,y)}
else if(desert){ctx.fillStyle="#d3b477";ctx.fillRect(0,235,800,55);ctx.fillStyle="#e0c58c";ctx.fillRect(0,245,800,35);for(const [x,y] of [[95,90],[700,110],[130,390],[700,400]]){ctx.fillStyle="#92754d";ctx.fillRect(x,y,30,14);ctx.fillStyle="#c9aa72";ctx.fillRect(x+4,y-7,22,9)}}
else{for(const [x,y] of [[70,75],[700,75],[100,400],[710,390],[330,55],[480,420]])drawTree(x,y);ctx.fillStyle="#9aaf79";ctx.fillRect(0,240,800,24);ctx.fillStyle="#b8c78d";ctx.fillRect(0,246,800,10)}
ctx.fillStyle="rgba(31,36,35,.65)";ctx.fillRect(10,10,180,30);ctx.fillStyle="#fff0c9";ctx.font="bold 17px system-ui";ctx.textAlign="left";ctx.fillText(zone,20,31);
(world.monsters||[]).forEach(m=>{if(m.name==="Lunatic")drawLunatic(m);else drawPoring(m);ctx.textAlign="center";ctx.font="bold 11px system-ui";ctx.fillStyle="#2b2430";ctx.fillText(m.name,m.x,m.y-31);ctx.fillStyle="#382b31";ctx.fillRect(m.x-20,m.y+22,40,5);ctx.fillStyle=m.hp>0?"#d84e5a":"#777";ctx.fillRect(m.x-20,m.y+22,40*Math.max(0,m.hp)/m.maxHp,5);ctx.fillStyle="#fff";ctx.font="10px system-ui";ctx.fillText(m.hp>0?m.hp+" HP":"Respawn",m.x,m.y+39)});
(world.players||[]).forEach(drawHero);$("stats").textContent="Lv. "+me.level+" • "+me.job+" • HP "+me.hp}
function moveSide(dir){if(!me)return;facing=dir<0?1:2;walkUntil=Date.now()+240;me.x=Math.max(35,Math.min(765,me.x+dir*24));socket.emit("move",{x:me.x,y:me.y});draw()}
function startWalk(dir){stopWalk();moveSide(dir);walkTimer=setInterval(()=>moveSide(dir),150)}
function stopWalk(){if(walkTimer){clearInterval(walkTimer);walkTimer=null}}
function bindWalk(id,dir){const b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startWalk(dir)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,stopWalk));b.addEventListener("contextmenu",e=>e.preventDefault())}
bindWalk("leftBtn",-1);bindWalk("rightBtn",1);\nfunction animationLoop(){if(me)draw();requestAnimationFrame(animationLoop)}requestAnimationFrame(animationLoop);
$("attackBtn").addEventListener("click",()=>{if(!me)return;const target=(world.monsters||[]).filter(m=>m.hp>0).map(m=>({m,d:Math.hypot(m.x-me.x,m.y-me.y)})).sort((a,b)=>a.d-b.d)[0];if(target&&target.d<=110){animateAttack(target.m.id);socket.emit("attack",target.m.id)}else{const line=document.createElement("div");line.textContent="✦ ไม่มีมอนสเตอร์อยู่ใกล้พอให้โจมตี";$("messages").appendChild(line);$("messages").scrollTop=$("messages").scrollHeight}});
canvas.addEventListener("click",e=>{if(!me)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*500/r.height;const dx=x-me.x,dy=y-me.y;if(Math.abs(dx)>Math.abs(dy))facing=dx<0?1:2;else facing=dy<0?3:0;const m=(world.monsters||[]).find(v=>Math.hypot(v.x-x,v.y-y)<30&&v.hp>0);if(m){animateAttack(m.id);socket.emit("attack",m.id)}else{walkUntil=Date.now()+500;socket.emit("move",{x,y})}me.x=x;me.y=y;draw()});
$("chatForm").onsubmit=e=>{e.preventDefault();const v=$("chatInput").value.trim();if(v)socket.emit("chat",v);$("chatInput").value=""};
</script>
</body></html>
